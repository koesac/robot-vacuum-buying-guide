name: Deploy guide to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build data-driven site
        run: python3 scripts/build.py
      - name: Check JavaScript syntax
        run: python3 -c "import re,pathlib; print(re.search(r'<script>(.*)</script>',pathlib.Path('_site/index.html').read_text(),re.S).group(1))" | node --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
